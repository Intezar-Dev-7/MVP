name: gitgossip
description: "GitGossip - Social app for developers"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # ---------------- UI & RESPONSIVENESS ----------------
  responsive_builder: ^0.7.1 # Handle mobile/tablet/web layouts properly
  google_fonts: ^7.0.0 # Custom fonts from Google
  iconsax: ^0.0.8 # Modern icon pack
  font_awesome_flutter: ^10.7.0 # Popular brand & social icons

  # ---------------- STATE & STORAGE ----------------
  provider: ^6.1.5 # State management
  shared_preferences: ^2.5.3 # Local key-value storage
  flutter_secure_storage: ^10.0.0 # Secure storage (tokens, secrets)

  # ---------------- NETWORK ----------------
  dio: ^5.8.0+1 # Advanced HTTP client (interceptors, retry, etc.)
  http: ^1.4.0 # Simple REST calls (remove if using only Dio)

  # ---------------- NAVIGATION ----------------
  go_router: ^17.0.1 # Clean declarative routing

  # ---------------- FIREBASE ----------------
  firebase_core: ^4.2.1 # Initialize Firebase
  firebase_auth: ^6.1.2 # Authentication
  google_sign_in: ^6.2.1 # Google login
  cloud_firestore: ^6.1.0 # Database

  # ---------------- FILE & MEDIA ----------------
  file_picker: ^10.3.3 # Pick files from device
  image_picker: ^1.2.1 # Pick images from gallery/camera

  # ---------------- UTILITIES ----------------
  intl: ^0.20.2 # Date & number formatting

  # ---------------- DEFAULT ICONS ----------------
  cupertino_icons: ^1.0.8 # iOS-style icons

  # ---------------- APP ICON ----------------
  flutter_launcher_icons: ^0.14.4 # Generate app launcher icon

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0 # Code quality rules

flutter:
  uses-material-design: true

# ---------------- APP ICON CONFIG ----------------
flutter_launcher_icons:
  image_path: "assets/icons/appIcon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/appIcon.png"
